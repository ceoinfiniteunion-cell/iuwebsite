name: CI

on:
  push:
    branches: [main, redesign-2026]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - name: Install deps
        run: npm ci
      - name: npm audit
        run: npm audit --audit-level=high --omit=dev
      - name: HTML validate (all pages)
        run: npm run lint:html
      - name: CSS lint
        run: npm run lint:css
      - name: ESLint
        run: npm run lint:js
      - name: SEO & integrity checks
        run: npm run check:static

  e2e:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - name: Install deps
        run: npm ci
      - name: Install Playwright browsers (Chromium, WebKit, Firefox)
        run: npx playwright install --with-deps chromium webkit firefox
      - name: E2E — forms (mocked API), menu, SW, reduced motion, smoke on 5 devices
        run: npx playwright test --reporter=list
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  lighthouse:
    runs-on: ubuntu-latest
    needs: [lint, e2e]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - name: Install deps
        run: npm ci
      - name: Lighthouse CI (templates, mobile budgets)
        run: npm run lhci
